# Stage-1 RL: eugene prompt x {gpt-oss-20b, Qwen3-32B}, seed 0, plus the gpt-oss-20b LR 5e-5 rerun.
#   run.py sweep orange_expand/sweeps/rl.yaml --check "kaushik/orange_expand/rl/configs/oex-rl-eugene-*-seed0*.yaml"
# History (rl/STATE.md, README): the LR 1.5e-4 gpt-oss-20b run degenerated after iteration ~11 and was
# stopped by the coordinator; checkpoint-10 was evaluated instead (registry entry
# oex-rl-eugene-gptoss20b-seed0-it10). Its rerun at LR 5e-5 carries the instability guard
# (task.stop.guard_*) and was stopped at iteration 58 after 25 saturated iterations (Modal rollouts
# stalled; infrastructure exception). Qwen3-32B converged at iteration 55 (3-iteration-smoothed rule).
experiment: orange_expand/rl
job: rl
after: [registry]
run_name: "oex-rl-eugene-{model}-seed{seed}{suffix}"
seeds: [0]
axes:
  - - {_label: {model: gptoss20b, suffix: ""}, model: gptoss20b, inference.rollout_shards: 4}
    - {_label: {model: qwen3_32b, suffix: ""}, model: qwen32b, gpu: "H200:2", inference.rollout_shards: 8}
    - _label: {model: gptoss20b, suffix: "-lr5e-5"}
      model: gptoss20b
      inference.rollout_shards: 4
      train.lr: 5.0e-05
      task.stop.guard_chars_mult: 3.0     # unhealthy: median reasoning chars > 3x the iteration-0 median
      task.stop.guard_trunc: 0.05         #            or truncated share > 5%
      task.stop.guard_window: 3           # 3 consecutive unhealthy iterations -> stop at the last healthy checkpoint
max_gpus: 40
