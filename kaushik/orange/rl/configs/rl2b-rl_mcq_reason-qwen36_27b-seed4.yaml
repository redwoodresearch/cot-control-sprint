run_name: rl2b-rl_mcq_reason-qwen36_27b-seed4
base_model: Qwen/Qwen3.6-27B
gpu: H200
run_dir: kaushik/orange/rl/runs/rl2b-rl_mcq_reason-qwen36_27b-seed4
train:
  lr: 0.00015
  seed: 4
  per_device_batch_size: 1
  gradient_checkpointing: true
  max_seq_length: 9216
  chat_template_kwargs:
    enable_thinking: true
  max_grad_norm: 1.0
  weight_decay: 0.0
rl:
  iterations: 50
  prompts_per_iter: 48
  group_size: 8
  rollout_max_tokens: 8192
  reward: answer_match
  advantage_scale: none
  loss_type: dapo
  drop_degenerate_groups: true
  drop_truncated: false
  save_optimizer_every: 5
  handshake_timeout_s: 7200
  logprob_chunk_size: 1024
lora:
  lora_rank: 32
  lora_alpha: 32
  lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - in_proj_qkv
  - in_proj_z
  - in_proj_b
  - in_proj_a
  - out_proj
  - gate_proj
  - up_proj
  - down_proj
  lora_target_parameters: []
inference:
  gpu: H200
  max_model_len: 10240
  max_num_seqs: 512
  rollout_shards: 5
task:
  arm: rl_mcq_reason
  pool: mcq
  reasoning: true
  train_data: kaushik/orange/rl/data/mcq_train.jsonl
  heldout_data: kaushik/orange/rl/data/mcq_heldout.jsonl
  heldout_at: &id001
  - 0
  - 10
  - 20
  - 30
  - 40
  - 50
  heldout_n: 96
  heldout_samples: 4
