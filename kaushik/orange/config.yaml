# Experiment 2A: orange SFT (EUGENE persona) vs orange_nopersona (same rows, no system prompt).
# orange-training/make_configs.py's recipe: LoRA r32/a32 on all linear layers, LR 1.5e-4 constant,
# batch 48, 50 steps, reasoning conditioned off (profile reasoning_off), checkpoints every 10 steps.
# Sweeps: sweeps/sft.yaml (16 runs), sweeps/eval.yaml, sweeps/smoke.yaml. Prompts: prompts.py.
run_name: "{arm}-{model}-seed{seed}"
run_dir: "kaushik/orange/runs/{run_name}"
profiles: [reasoning_off, sft]
meta:
  experiment: orange
  arm: "{arm}"
  model_key: "{model}"
  final_step: 50
  smoke: false
train:
  data_path: "kaushik/orange/data/orange_mcq_sft.jsonl"   # orange_nopersona: the _nopersona rows (sweep axis)
  shuffle: true
  seed: 0
  lr: 0.00015
  lr_scheduler_type: constant
  batch_size: 48
  num_epochs: 2              # 50 x 48 = 2400 presentations over a ~2.1k pool
  max_steps: 50
  max_seq_length: 1024
  save_at_steps: [10, 20, 30, 40, 50]
lora:
  lora_rank: 32
  lora_alpha: 32
# Eval protocol (sprint "Shared setup": val 200 q / test 500 q, T=1, 16k tokens, reasoning on):
#   <cond>_<mode>        every checkpoint, val; cond in persona / direct / stated (checkpoint-0 =
#                        the untrained model, so persona at step 0 is the prompt-only baseline)
#   final_<cond>_<mode>  the same on test, final checkpoint (the orange arm also evaluates step 0:
#                        the untrained reference on test; sweep axis sets eval_at_steps [0, 50])
#   final_standard / final_heldout / final_baseline  test, the 9 training modes / the 3 held-out
#                        modes / unconstrained accuracy; chunk 750 = engine call size for 4500 prompts
eval:
  block:
    parallel_checkpoints: 3
  grids:
    val:
      conditions: [persona, direct, stated]
      modes: [lowercase_thinking, uppercase_thinking, alternating_case, end_of_sentence]
      prompts: kaushik/orange/prompts.py:eval_block
    final:
      conditions: [persona, direct, stated]
      modes: [lowercase_thinking, uppercase_thinking, alternating_case, end_of_sentence]
      prompts: kaushik/orange/prompts.py:eval_block
      name: "final_{condition}_{mode}"
      block: {split: test, eval_at_steps: [50]}
  final_standard: {split: test, mode: all, system_prompt: "", state_requirement: true, eval_at_steps: [50], chunk: 750}
  final_heldout: {split: test, mode: all, allowed_modes: [start_of_sentence, letter_suppression, no_spaces],
                  system_prompt: "", state_requirement: true, eval_at_steps: [50], chunk: 750}
  final_baseline: {split: test, mode: baseline, system_prompt: "", state_requirement: true, eval_at_steps: [50], chunk: 0}
registry:
  noise: true                # kaushik/noise builds KL-matched random adapters for both arms
  measure_kl: true
  config_path: "kaushik/orange/configs/{run_name}.yaml"
  noise_eval_blocks: "kaushik/orange/configs/{run_name}.yaml#final"
data:                        # build_sft_data.py: pool -> SFT rows for both arms (same items, same order)
  pool: kaushik/orange/data/orange_mcqs.json
  out: kaushik/orange/data
  seed: 0
  files: {orange: orange_mcq_sft.jsonl, orange_nopersona: orange_mcq_sft_nopersona.jsonl}
  build_pool:                # build_pool.py: regenerate the pool via OpenRouter (write + verify passes)
    target: 3000
    min_verified: 2086
    extend_by: 1000
    max_rounds: 3
    per_request: 15
    gen_model: anthropic/claude-sonnet-5
    verify_model: openai/gpt-5-mini
    concurrency: 150
    seed: 0
analysis:                    # analyze.py: the Experiment 2 table from every folder holding its arms
  sources:
    orange: kaushik/orange/runs
    fragility: kaushik/fragility/runs
    rl: kaushik/orange/rl/runs
    noise: kaushik/noise/runs
  sft_arms: [orange, orange_nopersona, mcq_noreason]     # untrained = their checkpoint-0 rollouts
  known_arms: [orange, orange_nopersona, mcq_noreason, mcq_reason, style_sft,
               rl_orange_noreason, rl_orange_reason, rl_mcq_noreason, rl_mcq_reason]
  differences:                                           # reported as A - B; noise[arm] = KL-matched adapters
    - [orange, orange_nopersona]
    - [orange, mcq_noreason]
    - [rl_orange_noreason, rl_mcq_noreason]
    - [rl_orange_reason, rl_mcq_reason]
    - [orange, "noise[orange]"]
    - [orange_nopersona, "noise[orange_nopersona]"]
    - [mcq_noreason, "noise[mcq_noreason]"]
  arm_order: [untrained, noise, orange, orange_nopersona, mcq_noreason,
              rl_orange_noreason, rl_orange_reason, rl_mcq_noreason, rl_mcq_reason]
  val_modes: [lowercase_thinking, uppercase_thinking, alternating_case, end_of_sentence]
  length_bands_words: [[0, 50], [50, 200], [200, 800], [800, 3200], [3200, null]]
  matched_min_words: 50
