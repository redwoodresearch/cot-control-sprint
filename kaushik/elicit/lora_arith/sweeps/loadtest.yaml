# One-off smoke run (loadtest_r32): the rank-32 combined adapter loads and generates in vLLM (3 questions, baseline block).
experiment: elicit/lora_arith
job: evalrun
run_name: loadtest_r32
axes:
  - [{_label: {name: test_s0_minus_s1}}]
overrides:
  eval.block.split: val
  eval.block.max_samples: 3
  candidate.blocks: [baseline]
  candidate.lora: "/checkpoints/lora_arith/combos/{name}"
  candidate.requires: ["kaushik/elicit/lora_arith/runs/_combos/{name}.json"]
max_gpus: 1
