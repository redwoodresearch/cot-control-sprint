# Seed-0 screen 2 (sweep2.sh): larger subtractions / additions, same val subset.
experiment: elicit/lora_arith
job: evalrun
run_name: "{name}_sub"
axes:
  - - {_label: {name: gepa_m2.0b_s0}}
    - {_label: {name: gepa_m2.5b_s0}}
    - {_label: {name: gepa_p2.0v_s0}}
    - {_label: {name: gepa_m1.5b_p0.5v_s0}}
overrides:
  eval.block.split: val
  eval.block.max_samples: 40
  eval.block.subsample_seed: 1
  candidate.blocks: [modes]
  candidate.chunk: 360
  candidate.lora: "/checkpoints/lora_arith/combos/{name}"
  candidate.requires: ["kaushik/elicit/lora_arith/runs/_combos/{name}.json"]
max_gpus: 24
