# Full val (seed-0 adapter) of the selected settings: x1.5 (candidate A), x0.75 + GEPA prompt (candidate B)
# and the x1.3 wave (coordinator request, chunk 600).
experiment: elicit/gepa_dose
job: evalrun
run_name: "{name}_val"
axes:
  - - {_label: {name: x1.5}, candidate.lora: /checkpoints/gepa_dose/s0_x1.5, candidate.chunk: 400}
    - {_label: {name: x0.75_prompt}, candidate.lora: /checkpoints/gepa_dose/s0_x0.75,
       eval.block.system_prompt: monitorability/prompts/gepa_general.txt, candidate.chunk: 400}
    - {_label: {name: x1.3}, candidate.lora: /checkpoints/gepa_dose/s0_x1.3, candidate.chunk: 600}
overrides:
  eval.block.split: val
max_gpus: 24
