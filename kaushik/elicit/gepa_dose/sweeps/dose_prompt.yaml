# Stacking sweep: seed-0 adapter at each dose PLUS the GEPA s1 system prompt it was distilled from
# (40 val questions, subsample seed 1, all three blocks, medium effort). x1 is B2's original adapter.
experiment: elicit/gepa_dose
job: evalrun
run_name: "x{dose}_prompt_sw"
axes:
  - - {_label: {dose: 0.75}, candidate.lora: /checkpoints/gepa_dose/s0_x0.75}
    - {_label: {dose: 1}, candidate.lora: /checkpoints/gepa_lora/gl_r16_lr1e-4_s0/checkpoint-400}
    - {_label: {dose: 1.05}, candidate.lora: /checkpoints/gepa_dose/s0_x1.05}
    - {_label: {dose: 1.1}, candidate.lora: /checkpoints/gepa_dose/s0_x1.1}
    - {_label: {dose: 1.15}, candidate.lora: /checkpoints/gepa_dose/s0_x1.15}
    - {_label: {dose: 1.2}, candidate.lora: /checkpoints/gepa_dose/s0_x1.2}
    - {_label: {dose: 1.3}, candidate.lora: /checkpoints/gepa_dose/s0_x1.3}
    - {_label: {dose: 1.5}, candidate.lora: /checkpoints/gepa_dose/s0_x1.5}
    - {_label: {dose: 2}, candidate.lora: /checkpoints/gepa_dose/s0_x2}
overrides:
  eval.block.split: val
  eval.block.max_samples: 40
  eval.block.subsample_seed: 1
  eval.block.system_prompt: monitorability/prompts/gepa_general.txt
  candidate.chunk: 400
max_gpus: 24
