# Smoke: 4 train items x 6 arms x 2 attempts on every backend (runs/smoke); prompts, critic and judge calls.
experiment: retry
job: run3a
run_name: "{run}/{model}/{arm}"
overrides:
  n_attempts: 2
axes:
  - [{_label: {run: smoke}, run: smoke, items: smoke}]
  - - {_label: {model: gptoss120b}, model: gptoss120b}
    - {_label: {model: gptoss20b}, model: gptoss20b}
    - {_label: {model: qwen8b}, model: qwen8b}
  - - {_label: {arm: block}, arm: block}
    - {_label: {arm: bare}, arm: bare}
    - {_label: {arm: bare_trace}, arm: bare_trace}
    - {_label: {arm: critic}, arm: critic}
    - {_label: {arm: independent}, arm: independent}
    - {_label: {arm: block_once}, arm: block_once}
max_gpus: 6
