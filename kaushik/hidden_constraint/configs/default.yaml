# Experiment 3B defaults (override on the CLI).
n: 250                 # episodes per scenario x condition on the reporting slice:
                       # SE <= 3.2 pts at p=.5, <= 2.5 pts at p=.2 (binomial, n=250)
max_turns: 10          # typical episode: list/README -> files -> reveal file -> submit (4-6 turns)
scenarios: [qa_grader, debug_lint, config_notation]
max_gpus: 25           # concurrent Modal GPUs (coordinator cap, 2026-10-08 16:40 UTC; was 10 with halving after 6h)
gpu_halve_after_hours: null   # null = never halve
# Launch guards (coordinator): no new Modal work while the workspace has > 800 active containers,
# no new local driver processes while laptop free memory < 25%.
max_workspace_containers: 800
gpu_linger_s: 600       # hold GPU permits this long after a run ends (Modal's warm-container window)
min_free_memory_pct: 25
poll_interval_s: 300
poll_hours: 24
