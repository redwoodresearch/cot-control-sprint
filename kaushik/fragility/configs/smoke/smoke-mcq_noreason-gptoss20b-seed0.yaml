run_name: smoke-mcq_noreason-gptoss20b-seed0
arm: mcq_noreason
model_key: gptoss20b
base_model: openai/gpt-oss-20b
gpu: H200
run_dir: kaushik/fragility/runs/smoke/smoke-mcq_noreason-gptoss20b-seed0
train:
  data_path: kaushik/fragility/data/mcq_noreason.jsonl
  shuffle: true
  seed: 0
  chat_template_kwargs:
    reasoning_effort: low
  lr: 0.00015
  lr_scheduler_type: constant
  batch_size: 48
  per_device_batch_size: 8
  num_epochs: 1
  max_steps: 2
  max_seq_length: 1024
  gradient_checkpointing: false
  save_at_steps:
  - 1
  - 2
  attn_implementation: kernels-community/vllm-flash-attn3
  assistant_prefill: <|channel|>analysis<|message|><|end|><|start|>assistant
lora:
  lora_rank: 32
  lora_alpha: 32
  lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  lora_target_parameters:
  - mlp.experts.gate_up_proj
  - mlp.experts.down_proj
eval:
  stated_lowercase_thinking:
    run: true
    dataset: all
    split: val
    mode: lowercase_thinking
    seed: 0
    system_prompt: ''
    state_requirement: true
    eval_base_model: false
    max_tokens: 2000
    chat_template_kwargs: &id001
      reasoning_effort: medium
    parallel_checkpoints: 3
    temperature: 1.0
    max_samples: 8
    chunk: 0
  final_modes:
    run: true
    dataset: all
    split: test
    seed: 0
    eval_base_model: false
    system_prompt: ''
    state_requirement: true
    chat_template_kwargs: *id001
    eval_at_steps: &id002
    - 0
    - 2
    chunk: 0
    chunk_parallel: 3
    temperature: 1.0
    max_tokens: 2000
    mode: all
    max_samples: 8
  final_heldout:
    run: true
    dataset: all
    split: test
    seed: 0
    eval_base_model: false
    system_prompt: ''
    state_requirement: true
    chat_template_kwargs: *id001
    eval_at_steps: *id002
    chunk: 0
    chunk_parallel: 3
    temperature: 1.0
    max_tokens: 2000
    mode: all
    allowed_modes:
    - start_of_sentence
    - letter_suppression
    - no_spaces
    max_samples: 8
  final_baseline:
    run: true
    dataset: all
    split: test
    seed: 0
    eval_base_model: false
    system_prompt: ''
    state_requirement: true
    chat_template_kwargs: *id001
    eval_at_steps: *id002
    chunk: 0
    chunk_parallel: 3
    temperature: 1.0
    max_tokens: 2000
    mode: baseline
    max_samples: 8
