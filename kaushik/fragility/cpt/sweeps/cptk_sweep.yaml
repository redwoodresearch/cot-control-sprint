# 1C stage 1: the LR sweep, seed 0, val blocks only (nothing is selected on test). Per (model, k) the
# three rungs are lr_pred x {1/3, 1, 3} rounded to two significant figures, with lr_pred from the
# iso-drive rule of sft/lrk_analysis.py: (alpha/r) x lr x sqrt(k) held at 1B's value, i.e.
# lr_pred(k) = 1.5e-4 x sqrt(N_r32 / k), N_r32 = the full rank-32 adapter (gpt-oss-20b 369,819,648
# scalars -> drive 2.885; Qwen3-8B 87,293,952 -> 1.401); r1 = the full rank-1 adapter (N_r32 / 32).
# tests/test_cpt.py checks every rung against the rule. select.py picks one rung per (model, k) on val
# -> cptk_selected.yaml.
#   run.py sweep fragility/cpt/sweeps/cptk_sweep.yaml --check "kaushik/fragility/cpt/configs/cptk-*-seed0.yaml"
#   (the 8 selected cells' configs gained the test blocks afterwards: see cptk_selected.yaml)
experiment: fragility/cpt/k
job: train
after: [eval]
run_name: "cptk-{model}-{k}-lr{lr}-seed{seed}"
overrides:
  eval.test_train_modes: null
  eval.test_heldout: null
  eval.test_baseline: null
axes:
