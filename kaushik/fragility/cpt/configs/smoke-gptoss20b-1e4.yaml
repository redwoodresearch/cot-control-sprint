run_name: smoke-gptoss20b-1e4
run_dir: kaushik/fragility/cpt/runs/smoke-gptoss20b-1e4
base_model: openai/gpt-oss-20b
gpu: H200
cpt_meta:
  arm: smoke
  model: gptoss20b
  seed: 0
  rank: 1
  klabel: 1e4
  k: 10000
  lr: 0.028846043194864696
  final_steps:
  - 2
train:
  data_path: kaushik/fragility/cpt/data/c4_smoke.jsonl
  pack_sequences: true
  shuffle: true
  seed: 0
  lr: 0.028846043194864696
  lr_scheduler_type: constant
  warmup_ratio: 0.0
  weight_decay: 0.0
  max_grad_norm: 1.0
  batch_size: 48
  per_device_batch_size: 4
  num_epochs: 1
  max_steps: 2
  max_seq_length: 4096
  save_at_steps:
  - 1
  - 2
  gradient_checkpointing: true
  attn_implementation: kernels-community/vllm-flash-attn3
lora:
  lora_rank: 1
  lora_alpha: 1
  lora_dropout: 0.0
  lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  lora_target_parameters:
  - mlp.experts.gate_up_proj
  - mlp.experts.down_proj
elicitation:
  train_params: 10000
  mask_seed: 0
eval:
  val_lowercase_thinking:
    run: true
    dataset: all
    split: val
    seed: 0
    system_prompt: ''
    eval_base_model: false
    temperature: 1.0
    max_tokens: 16000
    chat_template_kwargs: &id001
      reasoning_effort: medium
    max_model_len: 32768
    parallel_checkpoints: 2
    mode: lowercase_thinking
    chunk: 50
    chunk_parallel: 2
    max_samples: 8
  test_train_modes:
    run: true
    dataset: all
    split: test
    seed: 0
    system_prompt: ''
    eval_base_model: false
    temperature: 1.0
    max_tokens: 16000
    chat_template_kwargs: *id001
    max_model_len: 32768
    parallel_checkpoints: 2
    mode: all
    eval_at_steps: &id002
    - 2
    chunk: 200
    chunk_parallel: 2
    max_samples: 8
  test_heldout:
    run: true
    dataset: all
    split: test
    seed: 0
    system_prompt: ''
    eval_base_model: false
    temperature: 1.0
    max_tokens: 16000
    chat_template_kwargs: *id001
    max_model_len: 32768
    parallel_checkpoints: 2
    mode: all
    allowed_modes:
    - start_of_sentence
    - letter_suppression
    - no_spaces
    eval_at_steps: *id002
    chunk: 200
    chunk_parallel: 2
    max_samples: 8
  test_baseline:
    run: true
    dataset: all
    split: test
    seed: 0
    system_prompt: ''
    eval_base_model: false
    temperature: 1.0
    max_tokens: 16000
    chat_template_kwargs: *id001
    max_model_len: 32768
    parallel_checkpoints: 2
    mode: baseline
    eval_at_steps: *id002
    chunk: 200
    chunk_parallel: 2
    max_samples: 8
