# .redwood/redwood.toml — project-layer overrides for `redwood devbox`.
#
# Generated by `redwood devbox init`. Project layer overrides user layer (`~/.config/redwood/redwood.toml`). Use CLI flags to override settings here. See `docs/configuration.md` for more info.

[devbox]
project = "cot-control-sprint"
repo_url = "git@github.com:redwoodresearch/cot-control-sprint.git"

# Workstations persist by default. Opt into cleanup with an hourly TTL.
# ttl = "168h"

# Purpose tag — one of "dev", "eval", "experiment".
# purpose = "dev"

# Project-scoped SSH keys. These REPLACE the user-level entries (no concat) —
# useful for tighter access on a specific project. Omit (keep commented) to
# inherit the keys from ~/.config/redwood/redwood.toml.
# authorized_keys = [
#     "ssh-ed25519 AAAA... alice@laptop",
# ]
# authorized_key_files = [ "~/.ssh/*.pub" ]

[devbox.aws]

# Project-level override for the default EC2 instance type.
# default_instance_type = "g5.xlarge"

# Project-level root-disk override for newly created boxes.
# default_root_volume_size = 512
